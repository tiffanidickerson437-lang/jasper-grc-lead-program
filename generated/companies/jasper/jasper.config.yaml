# jasper.config.yaml — Jasper AI (Senior GRC Lead application, Ashby d86a7821-b768-4f11-b540-3ee0fbc94c96)
#
# Sources (checked 2026-08-31). Every value below is marked with one of three states:
#   VERIFIED          — quoted or directly observable on a named public source
#   NAMED IN POSTING  — verbatim from the Ashby job description
#   INFERRED          — the analyst's read; flagged so it is never mistaken for fact
# A field with no defensible source is left EMPTY rather than guessed.
#
#   posting:        https://jobs.ashbyhq.com/Jasper%20AI/d86a7821-b768-4f11-b540-3ee0fbc94c96
#   trust center:   https://security.jasper.ai/            (Vanta-hosted; migration notice 2026-08-14)
#   trust page:     https://www.jasper.ai/trust
#   security page:  https://www.jasper.ai/security
#   legal center:   https://www.jasper.ai/legal
#   sub-processors: https://www.jasper.ai/legal/sub-processors
#   ISR exhibit:    https://www.jasper.ai/legal/security-requirements
#   CCPA notice:    https://www.jasper.ai/legal/ccpa
#   LLM routing:    https://www.jasper.ai/llm-optimized
#
# Verbatim from the posting, load-bearing for this config: "step in to rebuild and maintain
# momentum on audits"; "SOC 2, ISO 27001 ... readiness through certification, with a path
# toward ISO 42001"; "rationalize overlapping requirements ... single source of truth for
# control ownership"; "respond to customer security questionnaires"; "automate compliance
# workflows, including artifact collection ... continuous monitoring"; "drive ... AI
# governance across the company and product"; AI fluency with "agentic coding tools
# (Cursor, Claude Code ...)" and Python; GRC tooling named: "Vanta, Drata, OneTrust".

schema_version: 1

company:
  name: "Jasper"
  legal_entity: "Jasper AI, Inc."                # VERIFIED — PR Newswire filings and the CCPA notice name
                                                 # the Inc. entity.
  industry: ai-software
  sub_industry: marketing-agents-platform        # VERIFIED — "the marketing agents platform" is Jasper's
                                                 # own current self-description (posting + jasper.ai).
  size: mid                                      # VERIFIED range only — third-party headcount sources
                                                 # disagree (roughly 700+, remote-first). Never state a
                                                 # precise number; none is company-sourced.
  stage: rebuild                                 # VERIFIED, in the posting's own words: "step in to
                                                 # rebuild and maintain momentum on audits". SOC 2 held;
                                                 # ISO 27001:2022 landed 2026-08-14; trust center migrated
                                                 # to Vanta the same day.
  description: >
    AI marketing platform ("the marketing agents platform"), founded 2021, remote-first
    with teams in the US, France, and Australia. Serves enterprise marketing teams in
    compliance-heavy verticals. Routes work across multiple frontier-model providers and
    publicly commits that customer data is never used to train third-party LLMs. Holds
    SOC 2 and ISO/IEC 27001:2022 and publishes both through a Vanta-hosted trust center
    that replaced SafeBase on 14 August 2026.
  listings: []                                   # VERIFIED: privately held; no public listing.

frameworks:
  primary:                                       # certification targets on an annual cycle
    - soc2                                       # VERIFIED — trust center lists SOC 2; document catalog
                                                 # names "Jasper AI - SOC2 Type2.pdf". Report period and
                                                 # auditor are NDA-gated — never state them.
    - iso27001                                   # VERIFIED — trust center lists "ISO 27001:2022";
                                                 # certification announced 2026-08-14. First surveillance
                                                 # audit expected ~12 months later (ESTIMATE, flagged in
                                                 # the regulatory clock).
  emerging:
    - iso42001                                   # NAMED IN POSTING: "a path toward ISO 42001". No public
                                                 # AIMS artifacts exist. The engine ships the ISO 42001
                                                 # profile and NIST AI RMF crosswalk today, so the gap
                                                 # assessment is a render, not a project.
    - nist-ai-rmf                                # INFERRED as the sane scaffold for the posting's
                                                 # "AI governance across the company and product".
    - eu_ai_act                                  # VERIFIED obligation surface — generative outputs at
                                                 # scale, a French entity via the Clipdrop acquisition,
                                                 # EU customers. Art. 50(1)/(3)/(4) applied 2026-08-02;
                                                 # Art. 50(2) marking applies 2026-12-02. See
                                                 # 00-governance/regulatory-clock.md before citing dates.
    - gdpr                                       # VERIFIED — claimed on /trust and the trust center; DPA
                                                 # with SCCs published in the legal center.
    - ccpa                                       # VERIFIED — claimed on /trust and the trust center;
                                                 # candidate-facing notice v1.0 dated March 2024.
  claimed_marketing_only:
    - pci                                        # VERIFIED claim, UNVERIFIED scope — asserted on /trust
                                                 # ("SOC 2, PCI, DPA, CCPA, and GDPR") and as a "PCI DSS
                                                 # Compliant" badge on /security, while the trust center
                                                 # compliance list omits it. Full DSS vs. a payment-
                                                 # provider SAQ is not public. This inconsistency is
                                                 # finding F1, not a posture statement.

stack:
  # Only systems Jasper has itself named on public surfaces. Anything unnamed is left
  # empty rather than guessed — an invented system of record is an invented evidence source.
  cloud:
    - gcp                                        # VERIFIED — trust center subprocessor panel lists Google
                                                 # Cloud Platform as "Cloud provider"; the posting requires
                                                 # GCP expertise.
  identity: []                                   # DELIBERATELY UNSET — SSO/SCIM/MFA are described as
                                                 # product and workforce capabilities, but the IdP is
                                                 # never publicly named.
  code: []                                       # DELIBERATELY UNSET — not publicly named.
  ticketing: []                                  # DELIBERATELY UNSET — not publicly named.
  logging:
    - datadog                                    # VERIFIED — named on the legal sub-processors page.
    - splunk                                     # VERIFIED — named on the legal sub-processors page.
  grc-tool:
    - vanta                                      # VERIFIED — the trust center is Vanta-hosted; the
                                                 # migration notice (2026-08-14) says so explicitly.
                                                 # NAMED IN POSTING as familiarity ("Vanta, Drata,
                                                 # OneTrust").
  privacy-tool:
    - transcend                                  # VERIFIED — named on /security and the sub-processors
                                                 # page for privacy operations / DSRs.

risk:
  appetite: low-to-moderate                      # INFERRED — enterprise customers in financial services
                                                 # and healthcare marketing put every deal through
                                                 # security review; the posting makes the GRC seat the
                                                 # SME for those reviews.
  quantification: fair                           # NAMED IN POSTING (in substance): "maintain and
                                                 # continuously improve the risk register ... scoring".
                                                 # FAIR is the engine's quantification layer.
  tolerance-statements:
    # Each is phrased as an absolute negative tied to a specific mechanism, so it can become
    # a hard gate in the register rather than a sentiment.
    - "No customer content or customer PII is used to train a third-party foundation model — the public no-training commitment is evidenced per provider contract, not asserted."
    - "No model-routing change ships without the subprocessor, contract-notice, and evaluation checks its change type requires."
    - "No control is reported as operating on evidence that cannot be recomputed from a system of record on demand."
    - "No public surface asserts a certification the trust center cannot support."

# ai-products: true — turns on the 04-ai-governance pillar, the OWASP LLM Top 10 set,
# agent-identity controls, and the NIST AI RMF + ISO 42001 crosswalk.
ai-products: true
ai:
  agentic: true                                  # VERIFIED — the product IS agents: Agents library,
                                                 # Canvas, AI Studio, Jasper Grid, image/content
                                                 # pipelines, Jasper Chat, APIs, and an MCP server.
  product_surface: "marketing agents platform: agents library, canvas, studio, grid, image and content pipelines, chat, API, MCP server"
  multi_model_routing: true                      # VERIFIED — /llm-optimized: tasks route "to the
                                                 # best-performing model for the job" across providers,
                                                 # "constantly integrating new models". Model change is a
                                                 # living control surface; see
                                                 # 03-secure-development/model-change-management.md.
  llm_subprocessors:                             # VERIFIED — legal sub-processors page, checked
    - openai                                     # 2026-08-31. NOTE: the trust center subprocessor panel
    - google-gemini                              # shows only OpenAI, Google Gemini, and Anthropic —
    - anthropic                                  # Cohere appears on the legal page and not the panel.
    - cohere                                     # That divergence is finding F3, machine-checked in
                                                 # 05-stakeholder-management/public-claims-consistency/.
  no_training_commitment: true                   # VERIFIED — "your data is never used to train
                                                 # third-party LLMs" (jasper.ai/trust). A flagship public
                                                 # promise that must be evidenced per provider contract.
  high_impact_actions:                           # each becomes a row in the human-oversight gate register
    - model_routing_change_in_production
    - agent_action_on_customer_system            # MCP server and product integrations
    - automated_evidence_or_control_state_write

# data-types selects the mandatory control families and the privacy obligation set.
data-types:
  - customer-content                             # VERIFIED — retained for the agreement term; deleted on
                                                 # written request (/security).
  - limited-pii                                  # VERIFIED — "by default, Jasper handles limited
                                                 # customer PII (name and email)" (/security). Customers
                                                 # are told not to input PHI or cardholder data.

# regulated-jurisdictions selects which privacy regimes appear in the obligation register.
regulated-jurisdictions:
  - us                                           # VERIFIED — US company; CCPA notices published; Texas
                                                 # TRAIGA in force in the home state since 2026-01-01.
  - eu                                           # VERIFIED — French entity via the Clipdrop acquisition
                                                 # (Paris); EU customers; GDPR DPA with SCCs published.
                                                 # EU data-residency/hosting posture is NOT public —
                                                 # open question 7, never asserted.

emphasis:
  hero_control: CHG-02                           # Change management. Chosen because LLM-agnostic routing
                                                 # means Jasper swaps models continuously, and every swap
                                                 # touches the no-training promise, subprocessor notice
                                                 # duties, evaluation evidence, and customer contract
                                                 # representations — a governed change type nobody has
                                                 # named as a control surface yet.
  hero_pillar: 05-stakeholder-management         # The posting's centre of gravity runs through customer
                                                 # trust: questionnaires, RFPs, audits, and public claims
                                                 # that must agree with each other. F1 and F3 live here,
                                                 # machine-checked.

provenance:
  basis: public-sources-2026-08-31               # posting + trust center + trust/security/legal pages +
                                                 # sub-processors page + ISR exhibit + CCPA notice + PR.
                                                 # No claim is made about Jasper's internal security
                                                 # posture, report periods, or audit outcomes.
  author_disclosure: former-jasper-employee      # LOAD-BEARING, both ways: the author previously worked
                                                 # at Jasper, and NO non-public information from that
                                                 # employment is used, referenced, or alluded to anywhere
                                                 # in this repository. Every claim carries a public
                                                 # source and a check date precisely so that boundary is
                                                 # auditable.
  evidence_in_repo: none                         # LOAD-BEARING. No Jasper evidence exists in the repo
                                                 # and none is claimed. Every instrument here runs
                                                 # against committed observations of public surfaces.
